name: Jekyll Build

on:
  push:
    branches: [auto-opt, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04  # sassc 原生编译在 24.04 的 gcc13 下失败，Pages 同款 Jekyll 3.9.5 需要 22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: 安装 Jekyll 3.9.5（Pages 同版本）并构建
        run: |
          (gem install jekyll:3.9.5 jekyll-paginate --no-document 2>&1 | tee gem-install.log) || true
          set -o pipefail
          jekyll build --trace 2>&1 | tee build-output.log
      - name: 失败时把日志转成 error 注解（公开 API 可读）
        if: failure()
        run: |
          echo "::error::[ls] $(ls -la gem-install.log build-output.log 2>&1 | tr '\n' ' ' | cut -c1-180)"
          tail -10 gem-install.log | cut -c1-200 | while IFS= read -r l; do echo "::error::[gem] $l"; done
          if [ -f build-output.log ]; then
            echo "::error::[size] build-output.log $(wc -c < build-output.log) bytes"
            tail -40 build-output.log | cut -c1-200 | while IFS= read -r l; do echo "::error::[jekyll] $l"; done
          else
            echo "::error::[size] build-output.log 不存在——步骤4在构建行之前就已终止"
          fi
      - name: 失败时把日志提交回 auto-opt
        if: failure() && github.ref == 'refs/heads/auto-opt'
        run: |
          git config user.email "auto-opt@users.noreply.github.com"
          git config user.name "auto-opt bot"
          cp gem-install.log build-error.log 2>/dev/null || true
          echo "===== BUILD =====" >> build-error.log 2>/dev/null || true
          tail -80 build-output.log >> build-error.log 2>/dev/null || true
          git add build-error.log
          git commit -m "ci: 构建失败日志回传 [skip ci]" || echo "nothing to commit"
          git push origin auto-opt
