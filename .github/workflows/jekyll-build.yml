name: Jekyll Build

on:
  push:
    branches: [auto-opt, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: 安装 Jekyll 3.9.5（Pages 官方构建器同版本）并构建
        run: |
          (gem install jekyll -v 3.9.5 jekyll-paginate --no-document 2>&1 | tee gem-install.log) || true
          set -o pipefail
          jekyll build --trace 2>&1 | tee build-output.log
      - name: 失败时把日志提交回 auto-opt
        if: failure() && github.ref == 'refs/heads/auto-opt'
        run: |
          git config user.email "auto-opt@users.noreply.github.com"
          git config user.name "auto-opt bot"
          tail -60 gem-install.log > build-error.log 2>/dev/null || true
          echo "===== BUILD OUTPUT =====" >> build-error.log
          tail -80 build-output.log >> build-error.log 2>/dev/null || true
          git add build-error.log
          git commit -m "ci: 构建失败日志回传 [skip ci]" || echo "nothing to commit"
          git push origin auto-opt
